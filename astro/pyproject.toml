[project]
name = "astropt3"
version = "0.1.0"
description = "AstroPTv3: SmolLM3-architecture multimodal astronomical foundation models pretrained on the Multimodal Universe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Michael J. Smith" },
    { name = "UniverseTBD" },
]
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "einops>=0.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "lsdb",
    "huggingface-hub",
]

[project.optional-dependencies]
# Training machine only: the nanotron fork (../nanotron git submodule,
# editable) plus flash-attn (needs a CUDA toolchain or a matching prebuilt
# wheel — see astro/tests/test_nanotron_gpu.py for the verification recipe).
train = [
    "nanotron",
    "flash-attn",
    "wandb",
    "matplotlib>=3.8",  # eval sidecar sample panels (astropt3.eval.samples)
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",  # scripts/generate.py sample plots
]

[tool.uv.sources]
nanotron = { path = "../nanotron", editable = true }
# Tracks lsdb PR astronomy-commons/lsdb#1584 ("Filtering cross-match
# stream", draft, unmerged as of 2026-09-03), branch selective-x-match,
# which adds streams.CrossMatchStream: an InfiniteStream/CatalogStream
# subclass that does the left-join crossmatch(es) per drawn partition,
# optionally skipping a right catalog for a pixel via precomputed skymap
# count fractions. Tracking the branch (not a pinned commit) is
# deliberate while the PR is WIP -- re-run `uv lock -P lsdb` to pick up
# upstream fixes; re-pin to a release once it merges and ships.
lsdb = { git = "https://github.com/astronomy-commons/lsdb", branch = "selective-x-match" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astropt3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that need a GPU + nanotron env (run on the training machine)",
    "network: tests that stream live MMU catalogs from the HF hub",
]
addopts = "-m 'not gpu'"
